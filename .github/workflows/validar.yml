name: Validar traducciones
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 herramientas/validar.py
      # Al entrar algo a main, index.json se rehace solo (nadie tiene que tocarlo en un pull request).
      - name: Rehacer index.json
        if: github.event_name == 'push'
        run: |
          python3 herramientas/validar.py --indice
          if ! git diff --quiet index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "index.json al día" index.json
            git push
          fi
